# Fetches new disclosures and prices every day, rebuilds data/site, and commits the result.
# Vercel redeploys the site automatically when this commit lands on main.
name: Update data

on:
  schedule:
    # 22:17 UTC = 6:17 pm US Eastern (after the market close) = 6:17 am Beijing
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new filings per source (blank = no limit)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr   # OCR for scanned executive-branch reports
          pip install -r pipeline/requirements.txt

      # Prices and downloaded PDFs are large and rebuildable, so they live in the Actions cache, not in git.
      - name: Restore price / PDF cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Test the parsers
        working-directory: pipeline
        run: python -m pytest -q tests

      - name: Fetch and build
        id: build
        working-directory: pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python -m otrack all --limit "${{ github.event.inputs.limit }}"
          else
            python -m otrack all
          fi

      # Save what was fetched even if the build step failed, so the next run can resume.
      - name: Save price / PDF cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}

      - name: Commit changes
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/ref data/site data/review.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: daily update $(date -u +%F)"
            git push
          fi
